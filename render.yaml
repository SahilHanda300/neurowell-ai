services:
  - type: web
    name: neurowell-ai
    runtime: python
    plan: free
    region: oregon
    branch: dev
    buildCommand: >-
      apt-get update; apt-get install -y curl gnupg2 unixodbc; curl -sSL https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb -o msprod.deb; dpkg -i msprod.deb; apt-get update; ACCEPT_EULA=Y apt-get install -y msodbcsql18; pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
