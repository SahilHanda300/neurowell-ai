<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Signed out — NeuroWell AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-white text-gray-900">
    <div class="min-h-screen flex items-center justify-center">
      <div class="max-w-xl mx-auto p-6 text-center">
        <h1 class="text-2xl font-semibold mb-4">Signed out</h1>
        <p class="text-sm text-gray-600 mb-6">
          You have been signed out of the NeuroWell application.
        </p>
        <div class="space-x-3">
          <a
            href="/auth/google/login?prompt=select_account"
            class="inline-block px-4 py-2 bg-sky-600 text-white rounded"
            >Sign in with Google</a
          >
          <a
            href="/frontend"
            class="inline-block px-4 py-2 border rounded text-gray-700"
            >Return home</a
          >
        </div>
      </div>
    </div>
  </body>
</html>
